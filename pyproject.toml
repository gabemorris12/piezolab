[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "PyPiezo"
version = "0.1.0"
description = "Tools for piezoelectric transducer analysis."
readme = "readme.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Gabe Morris" }
]
keywords = ["piezoelectric", "impedance", "bvd", "materials", "analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "matplotlib>=3.10.8",
    "scipy>=1.17.1"
]

[project.urls]
Homepage = "https://github.com/gabemorris12/pypiezo"
Repository = "https://github.com/gabemorris12/pypiezo"
Issues = "https://github.com/gabemorris12/pypiezo/issues"

[tool.setuptools]
include-package-data = true
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pypiezo*"]

[tool.setuptools.package-data]
pypiezo = ["data/*.npy"]
