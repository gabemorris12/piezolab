[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pypiezo"
version = "0.1.0"
description = "Tools for piezoelectric analysis."
readme = "readme.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.8",
    "scipy>=1.17.1"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["pypiezo*"]

[tool.setuptools.package-data]
pypiezo = ["data/*.npy"]
